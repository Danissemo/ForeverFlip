name: Release

# Push a tag such as v1.0.0 to publish a GitHub release with the packaged addon. A tag with a
# suffix (v1.2.0-beta.6) publishes a pre-release with that beta's own changelog notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  helper:
    name: Build the Sync helper
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build ForeverFlipSync.exe
        run: |
          python -m pip install pyinstaller
          python tools/build_sync_helper.py --output dist

      - uses: actions/upload-artifact@v7
        with:
          name: helper
          path: dist/ForeverFlipSync.exe

  release:
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check that the tag matches the addon version
        run: |
          version=$(sed -n 's/^## Version: *//p' ForeverFlip/ForeverFlip.toc | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the TOC version $version" >&2
            exit 1
          fi

      - name: Run tests and package
        run: python tools/build.py --output dist

      - name: Extract release notes from CHANGELOG.md
        run: |
          python tools/release_notes.py --version "${GITHUB_REF_NAME#v}" \
            --repository "$GITHUB_REPOSITORY" --output release-notes.md

      - uses: actions/download-artifact@v8
        with:
          name: helper
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.exe $prerelease \
            --title "ForeverFlip ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
