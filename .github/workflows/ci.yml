name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, test and package
    # The local flow, the hooks and the Sync helper (tkinter, the tray) are Windows-only: one OS
    # would leave the way the addon is actually built and installed unchecked.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install StyLua
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) asset=stylua-windows-x86_64.zip ;;
            *) asset=stylua-linux-x86_64.zip ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/$asset"
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
          echo "$RUNNER_TEMP/stylua" >> "$GITHUB_PATH"

      - name: Check formatting
        run: stylua --check ForeverFlip

      - name: Check the Python (unused imports, undefined names)
        run: python -m pyflakes sync tools tests

      - name: Run tests and package
        run: python tools/build.py --output dist

      - uses: actions/upload-artifact@v7
        with:
          name: ForeverFlip-${{ matrix.os }}
          path: dist/

  catalogs:
    name: Package for the addon sites (dry run)
    # The release uploads with the BigWigs packager; this checks, without uploading, that it still
    # builds ForeverFlip/ForeverFlip.toc from what tools/build.py packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Package and stage
        id: stage
        run: |
          python tools/build.py --output dist --skip-tests
          echo "Dry run: no notes are published." > "$RUNNER_TEMP/notes.md"
          top=$(python tools/catalog_stage.py --zip dist/ForeverFlip-*.zip --notes "$RUNNER_TEMP/notes.md"             --out "$RUNNER_TEMP/stage")
          echo "top=$top" >> "$GITHUB_OUTPUT"

      - uses: BigWigsMods/packager@v2
        with:
          args: -d -t ${{ steps.stage.outputs.top }}

      - name: Check the package
        run: unzip -l ${{ steps.stage.outputs.top }}/.release/ForeverFlip-*.zip | grep -q ' ForeverFlip/ForeverFlip.toc$'
