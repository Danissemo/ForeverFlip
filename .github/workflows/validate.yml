name: Validate addon
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Pinned Lua tools
        run: |
          cargo install stylua --version 2.6.0 --locked --features lua51
          mkdir -p "$RUNNER_TEMP/luals"
          curl --fail --location --retry 3 https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz -o "$RUNNER_TEMP/luals.tar.gz"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "FF_LUALS=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"
      - name: Full validation and package
        run: python tools/build.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverFlip-checked-build
          path: dist/
